server {
    listen 80;
    server_name agendor.cadmus.com.br;   # ← altere para o domínio/IP da empresa

    # Redireciona para HTTPS (ative quando tiver certificado SSL)
    # return 301 https://$host$request_uri;

    # Tamanho máximo de upload (para screenshots)
    client_max_body_size 25M;

    # Logs
    access_log /var/log/nginx/agendor-access.log;
    error_log  /var/log/nginx/agendor-error.log;

    # Todas as rotas vão para o backend (que serve o frontend buildado)
    location / {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

