server {
    listen 80;
    server_name agendor.cadmus.com.br;   # ← altere para o domínio/IP da empresa

    # Redireciona para HTTPS (ative quando tiver certificado SSL)
    # return 301 https://$host$request_uri;

    # Tamanho máximo de upload (para screenshots)
    client_max_body_size 25M;

    # Logs
    access_log /var/log/nginx/agendor-access.log;
    error_log  /var/log/nginx/agendor-error.log;

    # Todas as rotas vão para o backend (que serve o frontend buildado)
    location / {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Margem, não solução. A tela de negócios parados (`GET /api/deals/stale`) varre o CRM ao
        # vivo: mesmo depois das correções de 2026-09-18 em backend/src/agendor.js, ela leva de 29 a
        # 36 s medidos contra a API real. Com o teto anterior de 60 s a folga era pequena demais, e
        # o modo de falha é feio: o 504 do nginx chega ao navegador como página HTML, o
        # `await dealsRes.json()` de frontend/src/components/DealsList.jsx quebra com
        # `Unexpected token '<'` e o usuário vê uma tela vazia com um erro que não descreve nada.
        #
        # 180 s NÃO autoriza a rota a ficar lenta — é o que impede um dia ruim da API Agendor de
        # virar tela quebrada. Se a medição passar de ~60 s de novo, o conserto é no backend (menos
        # requisições por carregamento), nunca subir este número outra vez.
        proxy_read_timeout 180s;
    }
}

