# Pipeline de CI (CI-01): dois jobs paralelos (backend, frontend).
# Roda lint + testes(+coverage) + build a cada pull_request e push na main.
# Node 20 fixado (D-09). Least-privilege: só leitura do repo (supply-chain, T-2-03-01).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: o workflow não precisa escrever nada (lint/test/build são públicos).
permissions:
  contents: read

jobs:
  # id do job = contexto do required status check (Pitfall 3) — NÃO adicionar name: custom.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20' # D-09 — alinhado ao alvo de produção
          cache: npm
          cache-dependency-path: backend/package-lock.json # lockfile por pacote (sem workspaces)
      - run: npm ci
      - run: npm run lint # biome lint . (warn-tolerante, D-06 — warnings não falham)
      - run: npm run test:coverage # node --test sob c8 (gate WR-03 via .c8rc.json)

  # id do job = contexto do required status check (Pitfall 3) — NÃO adicionar name: custom.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20' # D-09
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint # biome lint . (warn-tolerante)
      - run: npm run build # vite build (gate do frontend — sem testes nesta fase)

  # id do job = contexto do required status check (Pitfall 3) — NÃO adicionar name: custom.
  # Gate de segredos (CFG-01, D-08/D-09). Escaneia APENAS o range de commits do PR/push:
  # o token histórico do commit 13905d4 fica FORA do range, então este job não nasce vermelho.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # a action lista os commits do PR via API para calcular o range
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # OBRIGATÓRIO: --log-opts=base^..head precisa do histórico local
      - uses: gitleaks/gitleaks-action@v3 # SHA da tag em 2026-07-29: e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # a action aborta sem esta variável
          GITLEAKS_VERSION: '8.24.3' # fixo: 'latest' faria regra nova quebrar o gate sem mudança de código
          GITLEAKS_ENABLE_COMMENTS: 'false' # comentar em PR exigiria pull-requests: write
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false' # artefato SARIF sem uso aqui
